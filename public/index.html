<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cricket Overlay</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: "Poppins", sans-serif;
    }

    .overlay-wrapper {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      padding: 0 16px 16px;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      left: 50%;
      transform: translateX(-50%);
      width: min(100vw, 1280px);
      padding: 0 16px 16px;
      box-sizing: border-box;
    }

    .overlay {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 24px;
      padding: 16px 28px;
      border-radius: 24px 24px 0 0;
      background: linear-gradient(90deg, #003366, #00224e);
      border: 3px solid gold;
      border-bottom: 0;
      color: white;
      box-shadow: 0 0 25px rgba(0, 0, 0, .5);
      backdrop-filter: blur(8px);
      text-shadow: 0 0 5px rgba(0, 0, 0, .6);
    }

    .side {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 24px;
      min-width: 0;
    }

    .batting-side {
      justify-content: flex-start;
    }

    .bowling-side {
      justify-content: flex-end;
    }

    .team-block {
      display: flex;
      align-items: center;
    }

    .team-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      font-size: 1.1em;
    }

    .team-row img.team-logo {
      height: 58px;
      width: 58px;
      object-fit: contain;
      filter: drop-shadow(0 0 4px rgba(0, 0, 0, .6));
    }

    .team-row img.team-icon {
      height: 28px;
      width: 28px;
      object-fit: contain;
      filter: drop-shadow(0 0 4px rgba(0, 0, 0, .6));
    }

    .score-card {
      flex: 0 0 auto;
      min-width: 220px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      text-align: center;
    }

    .score {
      font-size: 2.2em;
      font-weight: 700;
      color: gold;
      line-height: 1;
    }

    .overs {
      font-size: 1em;
      color: #dbe9ff;
      letter-spacing: .03em;
    }

    .target {
      font-size: 1em;
      color: #ffd700;
      font-weight: bold;
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      from { text-shadow: 0 0 5px gold; }
      to { text-shadow: 0 0 15px gold; }
    }

    .players-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .player-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 1.05em;
    }

    .player-name {
      font-weight: 600;
    }

    .player-stats {
      color: #f0f4ff;
      font-size: .95em;
    }

    .bowler-block {
      text-align: right;
      align-items: flex-end;
    }

    .bowling-side .players-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-end;
      text-align: right;
    }

    .bowling-side .player-line {
      justify-content: flex-end;
    }

    @media (max-width: 900px) {
      .overlay {
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 20px;
      }

      .side {
        width: 100%;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 12px;
      }

      .team-block {
        justify-content: center;
      }

      .players-block,
      .bowling-side .players-block {
        align-items: center;
        text-align: center;
      }

      .player-line,
      .bowling-side .player-line {
        justify-content: center;
      }
    }

    .qcf-logo {
      position: absolute;
      top: 15px;
      left: 15px;
      height: 60px;
      width: 60px;
      opacity: .9;
      object-fit: contain;
      filter: drop-shadow(0 0 5px black);
    }

    .highlight {
      color: gold;
      font-weight: bold;
    }

    #debug-box {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: rgba(0, 0, 0, .75);
      color: lime;
      font-family: monospace;
      font-size: 12px;
      padding: 10px;
      border-radius: 8px;
      width: 320px;
      height: 200px;
      overflow-y: auto;
      display: none;
      z-index: 9999;
    }
  </style>
</head>

<body>
  <img src="qcf.png" alt="QCF Logo" class="qcf-logo" />

  <div class="overlay-wrapper">
    <div class="overlay">
      <div class="side batting-side">
        <div class="team-block">
          <div class="team-row">
            <img id="left-logo" class="team-logo" src="dragons.png" alt="Dragons" />
            <div id="left-name">Dragons</div>
            <img id="left-icon" class="team-icon" src="" style="display:none;" alt="Bat icon">
          </div>
        </div>
        <div class="players-block">
          <div id="striker-info" class="player-line"></div>
          <div id="non-striker-info" class="player-line"></div>
        </div>
      </div>

      <div class="score-card">
        <div id="score-text" class="score">-- / --</div>
        <div id="overs-text" class="overs">-- overs</div>
        <div id="target-text" class="target"></div>
      </div>

      <div class="side bowling-side">
        <div class="players-block bowler-block" id="bowler-info"></div>
        <div class="team-block">
          <div class="team-row" style="justify-content: flex-end; text-align: right;">
            <img id="right-icon" class="team-icon" src="" style="display:none;" alt="Ball icon">
            <div id="right-name">Opponent</div>
            <img id="right-logo" class="team-logo" src="enemy.png" alt="Enemy" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="debug-box"></div>

  <script>
    const query = new URLSearchParams(window.location.search);
    const matchId = query.get("matchId");
    const clubId = query.get("clubId");
    const api = query.get("api") || window.location.origin;
    const debug = query.get("debug") === "1";

    const debugBox = document.getElementById("debug-box");
    if (debug) debugBox.style.display = "block";

    async function updateOverlay() {
      try {
        const res = await fetch(`${api}/api/live?clubId=${clubId}&matchId=${matchId}&t=${Date.now()}`);
        const data = await res.json();

        if (debug) debugBox.innerText = JSON.stringify(data, null, 2);
        if (data.error) throw new Error(data.error);

        const parseRuns = (scoreString) => {
          if (!scoreString) return 0;
          const runsMatch = scoreString.toString().match(/\d+/);
          return runsMatch ? parseInt(runsMatch[0], 10) : 0;
        };

        const innings1 = data.innings1 || {};
        const innings2 = data.innings2 || {};
        const hasInnings2Score = parseRuns(innings2.score) > 0;
        const currentInnings = hasInnings2Score ? innings2 : innings1;

        document.getElementById("score-text").innerText = currentInnings.score || "--/--";
        document.getElementById("overs-text").innerText = `${currentInnings.overs || "--"} overs`;

        document.getElementById("left-name").innerText = data.battingTeam || "Dragons";
        document.getElementById("right-name").innerText = data.bowlingTeam || "Opponent";

        const leftIcon = document.getElementById("left-icon");
        const rightIcon = document.getElementById("right-icon");
        const leftLogo = document.getElementById("left-logo");
        const rightLogo = document.getElementById("right-logo");

        leftLogo.style.display = "none";
        rightLogo.style.display = "none";

        leftIcon.src = "bat.png";
        rightIcon.src = "ball.png";
        leftIcon.style.display = "block";
        rightIcon.style.display = "block";

        const battingTeam = data.battingTeam || "";
        const bowlingTeam = data.bowlingTeam || "";
        const battingIsDragons = battingTeam.toLowerCase().includes("dragon");
        const bowlingIsDragons = bowlingTeam.toLowerCase().includes("dragon");
        const dragonsPlaying = battingIsDragons || bowlingIsDragons;

        if (dragonsPlaying) {
          if (battingIsDragons) {
            leftLogo.src = "dragons.png";
            leftLogo.style.display = "block";
          } else {
            leftLogo.src = "enemy.png";
            leftLogo.style.display = "block";
          }

          if (bowlingIsDragons) {
            rightLogo.src = "dragons.png";
            rightLogo.style.display = "block";
          } else {
            rightLogo.src = "enemy.png";
            rightLogo.style.display = "block";
          }
        }

        const targetDiv = document.getElementById("target-text");
        const chaseActive = Boolean(innings1.score && currentInnings === innings2);
        if (chaseActive && data.target && parseInt(data.target, 10) > 0) {
          targetDiv.innerText = `Target: ${data.target}`;
        } else {
          targetDiv.innerText = "";
        }

        const strikerLine = document.getElementById("striker-info");
        const nonStrikerLine = document.getElementById("non-striker-info");
        const bowlerInfo = document.getElementById("bowler-info");

        const striker = (currentInnings && currentInnings.striker) || data.striker || null;
        const nonStriker = (currentInnings && currentInnings.nonStriker) || data.nonStriker || null;
        const bowler = (currentInnings && currentInnings.bowler) || data.bowler || null;

        const renderBatter = (element, player, isStriker) => {
          if (player && player.name) {
            const nameClass = isStriker ? "player-name highlight" : "player-name";
            const displayName = isStriker ? `${player.name} *` : player.name;
            element.innerHTML = `<span class="${nameClass}">${displayName}</span><span class="player-stats">${player.runs ?? "-"} (${player.balls ?? "-"})</span>`;
          } else {
            element.innerHTML = "";
          }
        };

        renderBatter(strikerLine, striker, true);
        renderBatter(nonStrikerLine, nonStriker, false);

        if (bowler && bowler.name) {
          bowlerInfo.innerHTML = `
            <div class="player-line">
              <span class="player-name highlight">${bowler.name}</span>
              <span class="player-stats">${bowler.wickets ?? "-"}-${bowler.runs ?? "-"} (${bowler.overs ?? "-"})</span>
            </div>
          `;
        } else {
          bowlerInfo.innerHTML = "";
        }

      } catch (err) {
        console.log("Overlay error:", err);
        if (debug) debugBox.innerText = "Error: " + err.message;
      }
    }

    setInterval(updateOverlay, 8000);
    updateOverlay();
  </script>
</body>

</html>
