<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Cricket Overlay</title>
  <style>
    :root {
      --bg: rgba(0,0,0,0.0);      /* transparent for OBS */
      --panel: rgba(0,0,0,0.7);
      --accent: #FFD700;          /* gold accent */
      --text: #ffffff;
      --muted: rgba(255,255,255,0.8);
      --radius: 12px;
      --shadow: 0 4px 12px rgba(0,0,0,0.4);
    }
    body {
      margin:0;
      background:var(--bg);
      font-family: "Segoe UI", sans-serif;
      color: var(--text);
    }
    .scorebar {
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:var(--panel);
      padding:12px 20px;
      border-radius:var(--radius);
      box-shadow: var(--shadow);
      font-size:20px;
      font-weight:700;
    }
    .score {
      font-size:34px;
      font-weight:800;
    }
    .overs {
      font-size:16px;
      color:var(--muted);
      margin-left:6px;
    }
    .players {
      display:flex;
      justify-content:space-between;
      margin-top:12px;
      background:var(--panel);
      padding:10px 20px;
      border-radius:var(--radius);
      box-shadow: var(--shadow);
      font-size:16px;
    }
    .player-box {
      flex:1;
      padding:0 10px;
    }
    .label {
      font-size:13px;
      color: var(--muted);
      text-transform: uppercase;
    }
    .value {
      font-size:18px;
      font-weight:700;
      margin-top:2px;
    }
    .value span {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <!-- Scoreboard -->
  <div class="scorebar">
    <div class="team" id="battingTeam">Team A</div>
    <div class="score" id="score">0/0 <span class="overs">(0.0 ov)</span></div>
    <div class="team" id="bowlingTeam">Team B</div>
  </div>

  <!-- Players / Bowler panel -->
  <div class="players">
    <div class="player-box">
      <div class="label">Striker</div>
      <div class="value" id="striker">--</div>
    </div>
    <div class="player-box">
      <div class="label">Non-Striker</div>
      <div class="value" id="nonStriker">--</div>
    </div>
    <div class="player-box">
      <div class="label">Bowler</div>
      <div class="value" id="bowler">--</div>
    </div>
  </div>

  <script>
    const qs = new URLSearchParams(location.search);
    const api = qs.get("api") || "";
    const clubId = qs.get("clubId");
    const matchId = qs.get("matchId");
    const refreshMs = parseInt(qs.get("refreshMs") || "4000", 10);

    async function update() {
      try {
        const r = await fetch(`${api}/api/score?clubId=${clubId}&matchId=${matchId}&t=${Date.now()}`);
        const data = await r.json();

        // Teams + score
        document.getElementById("battingTeam").textContent = data.battingTeam?.name || "Team A";
        document.getElementById("bowlingTeam").textContent = data.bowlingTeam?.name || "Team B";
        if (data.score) {
          document.getElementById("score").innerHTML =
            `${data.score.runs}/${data.score.wickets} <span class="overs">(${data.score.overs} ov)</span>`;
        }

        // Batsmen
        document.getElementById("striker").innerHTML =
          data.striker ? `${data.striker.name} <span>${data.striker.runs}(${data.striker.balls})</span>` : "--";
        document.getElementById("nonStriker").innerHTML =
          data.nonStriker ? `${data.nonStriker.name} <span>${data.nonStriker.runs}(${data.nonStriker.balls})</span>` : "--";

        // Bowler
        document.getElementById("bowler").innerHTML =
          data.bowler ? `${data.bowler.name} <span>${data.bowler.wickets}-${data.bowler.runs} (${data.bowler.overs})</span>` : "--";

      } catch (e) {
        document.getElementById("score").textContent = "Error loading score";
      } finally {
        setTimeout(update, refreshMs);
      }
    }

    update();
  </script>
</body>
</html>
