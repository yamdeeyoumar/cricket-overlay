<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CricClubs Scoreboard Overlay</title>
  <style>
    :root {
      color-scheme: dark;
      --overlay-bg: rgba(0, 15, 36, 0.9);
      --overlay-border: #ffd700;
      --overlay-text: #ffffff;
      --overlay-muted: #d7e8ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: transparent;
      color: var(--overlay-text);
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
      pointer-events: none;
    }

    .overlay-shell {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    .scoreboard-card {
      display: inline-flex;
      min-width: min(920px, calc(100vw - 32px));
      max-width: calc(100vw - 32px);
      align-items: center;
      justify-content: center;
      padding: 16px 28px;
      overflow: hidden;
      border: 3px solid var(--overlay-border);
      border-radius: 28px;
      background: linear-gradient(90deg, var(--overlay-bg), rgba(0, 34, 78, 0.92));
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      text-align: center;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.75);
    }

    #scoreboard {
      width: 100%;
    }

    #scoreboard .match-summary,
    #scoreboard .row,
    #scoreboard [class*="col-"] {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    #scoreboard .schedule-logo ul,
    #scoreboard ul.list-inline {
      display: flex !important;
      width: 100%;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 2.2vw, 28px);
      margin: 0;
      padding: 0;
      list-style: none;
    }

    #scoreboard li {
      margin: 0;
      padding: 0;
    }

    #scoreboard img {
      display: block;
      width: clamp(46px, 6vw, 76px);
      height: clamp(46px, 6vw, 76px);
      border: 2px solid rgba(255, 215, 0, 0.9);
      border-radius: 999px;
      object-fit: cover;
      background: rgba(255, 255, 255, 0.08);
      filter: drop-shadow(0 3px 7px rgba(0, 0, 0, 0.7));
    }

    #scoreboard .teamName {
      display: block;
      max-width: 240px;
      color: var(--overlay-text);
      font-size: clamp(16px, 2vw, 24px);
      font-weight: 800;
      line-height: 1.12;
      white-space: normal;
    }

    #scoreboard li.win,
    #scoreboard li.lose,
    #scoreboard li.tie {
      display: flex;
      min-width: 160px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    #scoreboard li.win > span:not(.teamName),
    #scoreboard li.lose > span:not(.teamName),
    #scoreboard li.tie > span:not(.teamName) {
      color: var(--overlay-border);
      font-size: clamp(28px, 4vw, 48px);
      font-weight: 900;
      line-height: 1;
    }

    #scoreboard p {
      margin: 0;
      color: var(--overlay-muted);
      font-size: clamp(13px, 1.5vw, 18px);
      font-weight: 700;
      line-height: 1.1;
      text-transform: lowercase;
    }

    #scoreboard .vs {
      color: var(--overlay-border);
      font-size: clamp(15px, 1.6vw, 22px);
      font-weight: 900;
      letter-spacing: 0.12em;
    }

    .status-message {
      color: var(--overlay-muted);
      font-size: 18px;
      font-weight: 700;
    }

    .status-message strong {
      display: block;
      color: var(--overlay-border);
      font-size: 24px;
      margin-bottom: 6px;
    }

    #debug-box {
      position: fixed;
      top: 12px;
      left: 12px;
      display: none;
      max-width: min(720px, calc(100vw - 24px));
      max-height: 45vh;
      overflow: auto;
      padding: 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.82);
      color: #00ff99;
      font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      white-space: pre-wrap;
    }

    @media (max-width: 700px) {
      .overlay-shell {
        padding: 8px;
      }

      .scoreboard-card {
        min-width: calc(100vw - 16px);
        max-width: calc(100vw - 16px);
        padding: 12px;
        border-radius: 18px;
      }

      #scoreboard .schedule-logo ul,
      #scoreboard ul.list-inline {
        gap: 8px;
      }

      #scoreboard li.win,
      #scoreboard li.lose,
      #scoreboard li.tie {
        min-width: 90px;
      }
    }
  </style>
</head>
<body>
  <main class="overlay-shell" aria-live="polite">
    <section class="scoreboard-card">
      <div id="scoreboard" class="status-message"><strong>Loading</strong>Fetching CricClubs scoreboard…</div>
    </section>
  </main>

  <pre id="debug-box"></pre>

  <script>
    const REFRESH_MS = 4000;
    const query = new URLSearchParams(window.location.search);
    const apiBase = query.get("api") || window.location.origin;
    const debug = query.get("debug") === "1";
    const scoreboard = document.getElementById("scoreboard");
    const debugBox = document.getElementById("debug-box");

    if (debug) debugBox.style.display = "block";

    function apiUrl() {
      const params = new URLSearchParams();
      const source = query.get("source") || query.get("url");
      const matchId = query.get("matchId");
      const clubId = query.get("clubId");

      if (source) {
        params.set("source", source);
      } else if (matchId && clubId) {
        params.set("matchId", matchId);
        params.set("clubId", clubId);
      }

      params.set("t", Date.now().toString());
      return `${apiBase}/api/live?${params.toString()}`;
    }

    function showError(message) {
      scoreboard.className = "status-message";
      scoreboard.innerHTML = `<strong>Scoreboard unavailable</strong>${escapeHtml(message)}`;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[character]));
    }

    async function refreshScoreboard() {
      try {
        const response = await fetch(apiUrl(), { cache: "no-store" });
        const contentType = response.headers.get("content-type") || "";
        const data = contentType.includes("application/json")
          ? await response.json()
          : { error: await response.text() };

        if (debug) debugBox.textContent = JSON.stringify(data, null, 2);
        if (!response.ok || data.error) throw new Error(data.error || `API returned HTTP ${response.status}`);

        scoreboard.className = "";
        scoreboard.innerHTML = data.html;
      } catch (error) {
        console.error("Scoreboard refresh failed", error);
        if (debug) debugBox.textContent = `Error: ${error.message}`;
        showError(error.message);
      }
    }

    refreshScoreboard();
    setInterval(refreshScoreboard, REFRESH_MS);
  </script>
</body>
</html>
