<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cricket Overlay</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: "Poppins", sans-serif;
    }

    .overlay-wrapper {
      position: absolute;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .overlay {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      border-radius: 20px;
      background: linear-gradient(90deg, #003366, #00224E);
      border: 3px solid gold;
      color: white;
      box-shadow: 0 0 25px rgba(0, 0, 0, .5);
      backdrop-filter: blur(8px);
    }

    .team {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .team img {
      height: 55px;
      width: 55px;
      object-fit: contain;
      filter: drop-shadow(0 0 4px rgba(0, 0, 0, .6));
    }

    .score {
      text-align: center;
      font-size: 1.85em;
      font-weight: 700;
      color: gold;
    }

    .overs {
      font-size: .95em;
      color: #ccc;
    }

    .target {
      font-size: 1em;
      color: #FFD700;
      font-weight: bold;
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      from { text-shadow: 0 0 5px gold; }
      to { text-shadow: 0 0 15px gold; }
    }

    .players {
      width: 100%;
      color: white;
      font-size: 1.2em;
      text-shadow: 0 0 5px black;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: 18px;
      background: linear-gradient(90deg, #003366, #00224E);
      border: 3px solid gold;
      padding: 18px 26px;
      border-radius: 20px;
    }

    .qcf-logo {
      position: absolute;
      top: 15px;
      left: 15px;
      height: 60px;
      width: 60px;
      opacity: .9;
      object-fit: contain;
      filter: drop-shadow(0 0 5px black);
    }

    .highlight {
      color: gold;
      font-weight: bold;
    }

    #debug-box {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: rgba(0, 0, 0, .75);
      color: lime;
      font-family: monospace;
      font-size: 12px;
      padding: 10px;
      border-radius: 8px;
      width: 320px;
      height: 200px;
      overflow-y: auto;
      display: none;
      z-index: 9999;
    }
  </style>
</head>

<body>
  <img src="qcf.png" alt="QCF Logo" class="qcf-logo" />

  <div class="overlay-wrapper">
    <div class="overlay">
      <div class="team left">
        <img id="left-logo" src="dragons.png" alt="Dragons" />
        <div id="left-name" style="font-weight:600;">Dragons</div>
        <img id="left-icon" src="" style="height:25px;width:25px;display:none;">
      </div>

      <div class="score">
        <div id="score-text">-- / --</div>
        <div class="overs" id="overs-text">-- overs</div>
        <div class="target" id="target-text"></div>
      </div>

      <div class="team right">
        <img id="right-icon" src="" style="height:25px;width:25px;display:none;">
        <div id="right-name" style="font-weight:600;">Opponent</div>
        <img id="right-logo" src="enemy.png" alt="Enemy" />
      </div>
    </div>

    <div class="players" id="players-info">
      <div id="batters-text"></div>
      <div id="bowler-text"></div>
    </div>
  </div>

  <div id="debug-box"></div>

  <script>
    const query = new URLSearchParams(window.location.search);
    const matchId = query.get("matchId");
    const clubId = query.get("clubId");
    const api = query.get("api") || window.location.origin;
    const debug = query.get("debug") === "1";

    const debugBox = document.getElementById("debug-box");
    if (debug) debugBox.style.display = "block";

    async function updateOverlay() {
      try {
        const res = await fetch(`${api}/api/live?clubId=${clubId}&matchId=${matchId}&t=${Date.now()}`);
        const data = await res.json();

        if (debug) debugBox.innerText = JSON.stringify(data, null, 2);
        if (data.error) throw new Error(data.error);

        const parseRuns = (scoreString) => {
          if (!scoreString) return 0;
          const runsMatch = scoreString.toString().match(/\d+/);
          return runsMatch ? parseInt(runsMatch[0], 10) : 0;
        };

        const innings1 = data.innings1 || {};
        const innings2 = data.innings2 || {};
        const hasInnings2Score = parseRuns(innings2.score) > 0;
        const currentInnings = hasInnings2Score ? innings2 : innings1;

        document.getElementById("score-text").innerText = currentInnings.score || "--/--";
        document.getElementById("overs-text").innerText = `${currentInnings.overs || "--"} overs`;

        document.getElementById("left-name").innerText = data.battingTeam || "Dragons";
        document.getElementById("right-name").innerText = data.bowlingTeam || "Opponent";

        const leftIcon = document.getElementById("left-icon");
        const rightIcon = document.getElementById("right-icon");
        const leftLogo = document.getElementById("left-logo");
        const rightLogo = document.getElementById("right-logo");

        leftLogo.style.display = "none";
        rightLogo.style.display = "none";

        leftIcon.src = "bat.png";
        rightIcon.src = "ball.png";
        leftIcon.style.display = "block";
        rightIcon.style.display = "block";

        const battingTeam = data.battingTeam || "";
        const bowlingTeam = data.bowlingTeam || "";
        const battingIsDragons = battingTeam.toLowerCase().includes("dragon");
        const bowlingIsDragons = bowlingTeam.toLowerCase().includes("dragon");
        const dragonsPlaying = battingIsDragons || bowlingIsDragons;

        if (dragonsPlaying) {
          if (battingIsDragons) {
            leftLogo.src = "dragons.png";
            leftLogo.style.display = "block";
          } else {
            leftLogo.src = "enemy.png";
            leftLogo.style.display = "block";
          }

          if (bowlingIsDragons) {
            rightLogo.src = "dragons.png";
            rightLogo.style.display = "block";
          } else {
            rightLogo.src = "enemy.png";
            rightLogo.style.display = "block";
          }
        }

        const targetDiv = document.getElementById("target-text");
        const chaseActive = Boolean(innings1.score && currentInnings === innings2);
        if (chaseActive && data.target && parseInt(data.target, 10) > 0) {
          targetDiv.innerText = `Target: ${data.target}`;
        } else {
          targetDiv.innerText = "";
        }

        const battersDiv = document.getElementById("batters-text");
        const bowlerDiv = document.getElementById("bowler-text");
        const { striker, nonStriker, bowler } = currentInnings;

        if (striker && nonStriker) {
          battersDiv.innerHTML = `
            <span class="highlight">${striker.name}</span> ${striker.runs || '-'} (${striker.balls || '-'}) ⚡
            <span>${nonStriker.name}</span> ${nonStriker.runs || '-'} (${nonStriker.balls || '-'})
          `;
        } else {
          battersDiv.innerText = "";
        }

        if (bowler) {
          bowlerDiv.innerHTML = `Bowler: <span class="highlight">${bowler.name}</span> ${bowler.overs || '-'}-${bowler.runs || '-'}-${bowler.wickets || '-'}`;
        } else {
          bowlerDiv.innerText = "";
        }

      } catch (err) {
        console.log("Overlay error:", err);
        if (debug) debugBox.innerText = "Error: " + err.message;
      }
    }

    setInterval(updateOverlay, 8000);
    updateOverlay();
  </script>
</body>

</html>
